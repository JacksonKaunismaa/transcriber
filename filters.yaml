# Transcription filters configuration
# Each filter has a pattern (regex) and optional flags (ignorecase, multiline, dotall)
# Filters are applied in order within each category

# Hallucinations from background noise / model artifacts
# Controlled by --allow-bye-thank-you flag (disables entire section)
hallucinations:
  # Common false positives
  - pattern: '\bBye[\.!]?\s*'
    flags: ignorecase
  - pattern: '\bThank you[\.!\?]?\s*'
  - pattern: 'Thank(?:s| you) for (?:joining|watching|listening|having|sharing|tuning in)\b.*?[\.!]\s*'
    flags: ignorecase
    comment: "Thank you/Thanks for joining/watching/listening/etc hallucinations"
  - pattern: '\bMBC\b\.?\s*'
  - pattern: '\bAmen\b\.?\s*'
    flags: ignorecase
  - pattern: '\bHehe\b\.?\s*'
    flags: ignorecase
  - pattern: '\bphew\b\.?\s*'
    flags: ignorecase
  - pattern: '\bPf+t\b[!\.]?\s*'
    flags: ignorecase
  - pattern: '\bPeace\b\.?\s*'
    flags: ignorecase
  - pattern: '\bHuh\b\.?\s*'
    flags: ignorecase
  - pattern: '\bHmph\b\.?\s*'
    flags: ignorecase
  - pattern: '\bRawr\b\.?\s*'
    flags: ignorecase
  - pattern: '\bPoof\b[!\.]?\s*'
    flags: ignorecase
  - pattern: '\bBoop\b[!\.]?\s*'
    flags: ignorecase
  - pattern: '\b(?:[Oo]m+\s*[Nn]om+(?:[,\s]+[Nn]om+)*|[Nn]om+(?:[,\s]+[Nn]om+)+)\b\.?\s*'
  - pattern: '\bOink[!\.]?\s*(?:Oink[!\.]?\s*)*'
    flags: ignorecase

  # YouTube outro / subscribe hallucinations
  # Short phrases that the repetition/speed detector can't catch (<10 words)
  - pattern: 'Thanks for watching!?\s*'
    flags: ignorecase
    comment: "YouTube outro: thanks for watching"
  - pattern: 'Thank you so much for watching\s*[\.!]*\s*'
    flags: ignorecase
    comment: "YouTube outro: thank you so much for watching"
  - pattern: 'Thanks for tuning in\.?\s*(?:We''ll talk to you again soon\.?)?\s*'
    flags: ignorecase
    comment: "YouTube outro: thanks for tuning in"
  - pattern: 'I''m going to go ahead and end this video\.?\s*(?:I will see you in the next video\.?\s*)?'
    flags: ignorecase
    comment: "YouTube outro: end this video"
  - pattern: 'Please leave a comment below[!\.]?\s*'
    flags: ignorecase
    comment: "YouTube outro: leave a comment"
  - pattern: '(?:Like,?\s*)?(?:comment,?\s*)?(?:and\s+)?subscribe\b.*?[\.!]\s*'
    flags: ignorecase
    comment: "YouTube outro: like/comment/subscribe"
  - pattern: 'If you like(?:d)? this video,?\s*(?:don''t forget to )?give it a thumbs up.*'
    flags: ignorecase
    comment: "YouTube outro: like/thumbs up/subscribe"
  - pattern: '(?:don''t forget to )?subscribe to (?:my|our|the) channel.*'
    flags: ignorecase
    comment: "YouTube outro: subscribe to channel"
  - pattern: '(?:I''ll |and I''ll |we''ll )?see you (?:guys )?(?:in the )?next (?:video|time|week)\.?\s*'
    flags: ignorecase
    comment: "YouTube outro: see you next video/time/week"
  - pattern: 'I hope you enjoyed this video\b.*'
    flags: ignorecase
    comment: "YouTube outro: I hope you enjoyed this video"
  - pattern: '(?:thank(?:s| you) )?for showing up\b.*'
    flags: ignorecase
    comment: "YouTube/podcast outro: thanks for showing up"
  - pattern: 'We love you\.?\s*'
    flags: ignorecase
    comment: "YouTube outro: we love you"
  # Longer YouTube outros caught by speed detector, but kept as regex for completeness
  - pattern: '(?:But )?[Ii]f you(?:''re| are) watching this,? make sure to (?:like|subscribe).*(?:Bye[ -]?bye|next time)\.?\s*'
    flags: ignorecase
    comment: "YouTube outro: if you're watching make sure to like/subscribe"
  - pattern: 'If you don''t have a phone.*see you next time\.?\s*'
    flags: ignorecase
    comment: "YouTube outro: if you don't have a phone"
  - pattern: 'Like, subscribe,? and share\b.*?[\.!]+\s*'
    flags: ignorecase
    comment: "YouTube outro: like subscribe and share"

  # Website hallucinations
  - pattern: 'www\.larryweaver\.com\.?\s*'
    flags: ignorecase
  - pattern: '(?:Go to )?Beadaholique\.com\b.*'
    flags: ignorecase
    comment: "Beadaholique.com ad hallucination (any variant)"
  - pattern: 'For more information,? go to www\.fema\.gov\.?\s*'
    flags: ignorecase
  - pattern: 'www\.mooji\.org\.?\s*'
    flags: ignorecase
  - pattern: 'www\.globalonenessproject\.org\.?\s*'
    flags: ignorecase
  - pattern: 'www\.mytrendyphone\.co\.uk\.?\s*'
    flags: ignorecase
  - pattern: '(?:www\.(?:youtube|facebook|instagram)\.com\s*(?:or\s*)?){1,}\.?\s*'
    flags: ignorecase
    comment: "Social media URL hallucinations (youtube/facebook/instagram)"
  - pattern: 'Beading supplies need!?\s*'
    flags: ignorecase
  - pattern: '(?:www\.)?(?:Flydreamers|engvid|circlelineartschool|cbrnstuff|listenews)\.com\.?\s*'
    flags: ignorecase
    comment: "Hallucinated URLs found via transcript mining"
  - pattern: 'Learn English for free\b.*'
    flags: ignorecase
    comment: "engvid.com ad hallucination"
  - pattern: 'Ding(?:-a-ling)+\.{0,3}\s*'
    flags: ignorecase
  - pattern: 'All right,? ladies and gentlemen,? we''ll be right back\.?\s*'
    flags: ignorecase

  # Affection / rhetorical hallucinations
  - pattern: 'I love (?:you|her|him)\.?\s*'
  - pattern: "Isn't it\\?\\.?\\s*"

  # Standalone word hallucinations
  - pattern: '^\s*You[\.!\?]?\s*$'
    flags: ignorecase
    comment: "Standalone 'You'/'you' hallucination from background noise"
  - pattern: '\bBitch\b[!\.]?\s*'
    flags: ignorecase
    comment: "Profanity hallucination from background noise"

  # Sign-off / outro hallucinations
  - pattern: 'That''s all I''m gonna say\.?\s*'
    flags: ignorecase
  - pattern: 'We''ll see you soon\.?\s*'
    flags: ignorecase
  - pattern: 'See you soon\.?\s*'
    flags: ignorecase
  - pattern: '\bBuh-bye\b\.?\s*'
    flags: ignorecase
  - pattern: '\bCheers\b\.?\s*'
    flags: ignorecase

  # Stage direction hallucinations (model describes sounds instead of transcribing)
  - pattern: '\*+\s*CLEARS THROAT\s*\*+'
    flags: ignorecase
    comment: "Stage direction: **CLEARS THROAT**"

  # Name hallucinations
  - pattern: '\bBARBARA MINKOVIC\b\.?\s*'
    flags: ignorecase
    comment: "Name hallucination from background noise"

  # Subtitle watermarks
  - pattern: 'Altyaz.*M\.?\s*K\.?\s*'
    flags: ignorecase
  - pattern: 'Subs by www\.zeoranger\.co\.uk\.?\s*'
    flags: ignorecase
  - pattern: '(?:The )?Transcribed by https?://otter\.ai\.?\s*'
    flags: ignorecase
    comment: "Otter.ai watermark hallucination"

  # Foreign language hallucinations
  - pattern: 'Belki de sadece\.{0,3}\s*'
    comment: "Turkish 'Maybe just...' hallucination"
  - pattern: 'Bonne nuit\.?\s*'
    comment: "French 'Good night' hallucination"
  - pattern: 'Arigatou gozaimashita\.?\s*'
    flags: ignorecase
    comment: "Japanese 'Thank you very much' hallucination"
  - pattern: '\bAbonne-toi\b[!\.]?\s*'
    flags: ignorecase
    comment: "French 'Subscribe!' YouTube hallucination"
  - pattern: '\bTcha+[ou]+\b[!\.]?\s*'
    flags: ignorecase
    comment: "French/Portuguese 'Bye' (Tchao, Tchaaau, etc.)"
  - pattern: '\bSalut\b\.?\s*'
    comment: "French 'Hi/Bye' hallucination"
  - pattern: 'Podemos mudar\.{0,3}\s*'
    comment: "Portuguese 'We can change...' hallucination"
  - pattern: '\bUnd das hei(?:t|ss?t) nicht\b.*'
    flags: ignorecase
    comment: "German TV broadcast fragment"
  - pattern: '(?:In der |Eine )?Sendung\b.*'
    flags: ignorecase
    comment: "German 'broadcast/show' TV fragment"
  - pattern: 'In der Seite liegen\b.*'
    flags: ignorecase
    comment: "German TV fragment"
  - pattern: '(?:Slo )?quiero que queden\b.*'
    comment: "Spanish TV bleed-through"
  - pattern: 'trabaj(?:o|) (?:en|siempre)\b.*'
    comment: "Spanish TV bleed-through"
  - pattern: 'Om Namah Shivaya\.?\s*'
    flags: ignorecase
    comment: "Sanskrit mantra hallucination"
  - pattern: 'ett joudutaan\.?\s*'
    comment: "Finnish hallucination"
  - pattern: 'Hvad det\??\s*'
    comment: "Danish 'What's that?' hallucination"

  # Onomatopoeia hallucinations
  - pattern: '\bVroom\b[,!\.]?\s*(?:\bvroom\b[,!\.]?\s*)*'
    flags: ignorecase
    comment: "Vroom, vroom, vroom."
  - pattern: '\bBoom\b[,!\.]?\s*(?:\bboom\b[,!\.]?\s*)*'
    flags: ignorecase
    comment: "Boom, boom, boom."
  - pattern: '\bTch\b\.?\s*'
    flags: ignorecase
    comment: "Tch. (tongue click hallucination)"
  - pattern: '\bTsk[,\.]?\s*(?:tsk[,\.]?\s*)*'
    flags: ignorecase
    comment: "Tsk, tsk. (disapproving click hallucination)"
  - pattern: '\bBz+\b\.?\s*'
    flags: ignorecase
    comment: "Bzzz (buzzing hallucination)"
  - pattern: '\bcough\b\.?\s*(?:\bcough\b\.?\s*)*'
    flags: ignorecase
    comment: "Literal 'cough' transcription of cough sounds"
  - pattern: '\bpbbt\b\.?\s*'
    flags: ignorecase
    comment: "Raspberry/lip sound hallucination"
  - pattern: '\bMoo+\b[!\.]?\s*'
    flags: ignorecase
    comment: "Moo/Moooo (animal sound hallucination)"

  # Exclamatory noise hallucinations
  - pattern: '\bBuh+\b\.?\s*'
    flags: ignorecase
    comment: "Buhhhhh, Buh, etc."

  # Repeated characters (keyboard noise, etc.)
  - pattern: '\b[Aa]+[Hh]+\b\.?\s*'
    comment: "Ahhh, aaahhhh, etc."
  - pattern: '\b[AaRr]+[Rr]{4,}\b\.?\s*'
    comment: "Arrrr, Rrrrrr, etc."
  - pattern: '\b([A-Za-z])\1{4,}\b\.?\s*'
    flags: ignorecase
    comment: "5+ repeated chars (ignorecase for mixed-case like Zzzzzzzzzz)"
  - pattern: '\b([a-zA-Z])\1{2,}(?:([a-zA-Z])\2{1,})+\b\.?\s*'
    flags: ignorecase
    comment: "Multi-group repeated-char gibberish (e.g., gggggghhh)"
  - pattern: '(\w{2,5})\1{4,}'
    comment: "Repeated syllables (e.g., NINGNINGNING, KINGKINGKING)"
  - pattern: '([A-Za-z])(?:-\1){3,}\.?\s*'
    flags: ignorecase
    comment: "Stuttering hallucination (e.g., B-b-b-b-b-b)"

  # Media title hallucinations
  - pattern: 'RESIDENT EVIL \d+\.?\s*'
    comment: "RESIDENT EVIL 3, etc."

  # Music/lyrics hallucinations
  - pattern: '♪.*'
    comment: "Music notes - usually hallucinated lyrics"
  - pattern: 'mom\s+mom\s+mom.*I don''t know.*I don''t know.*'
    flags: ignorecase
    comment: "Song lyric hallucination (mom mom mom... I don't know)"

# Filler words/sounds
# Only applied when allow_fillers=False
fillers:
  - pattern: '\b[Uu]+[hm]+\b(?!-)[\.\,\!\?]?\s?'
    flags: ignorecase
    comment: "um, umm, uh, uuuummm, etc. but NOT uh-oh"
  - pattern: '\b(?:er+m*|hm+|mhm+|uh-huh|mm+|ahem)\b[\.\,\!\?]?\s?'
    flags: ignorecase
    comment: "er, hmm, mhm, uh-huh, mm, ahem"
  - pattern: '\b[oa]h+[\.\,\!\?]+\s*'
    flags: ignorecase
    comment: "oh, ah only when standalone with punctuation"
  - pattern: '^\s*\.{2,}\s*$'
    comment: "Just ellipsis"
  - pattern: '^\s*,\s*'
    comment: "Leading comma"

# Non-ASCII character filter
# Only applied when allow_non_ascii=False
non_ascii:
  - pattern: '[^\x20-\x7E]'
    comment: "Remove non-ASCII printable characters"
